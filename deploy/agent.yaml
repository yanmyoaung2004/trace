# Default agent config baked into the image. No secrets here: the API key
# is injected at deploy time via TRACE_API_KEY / TRACE_API_KEY_FILE env
# or a mounted agent.key (see install.sh, daemonset.yaml). server_url
# matches the server image default (:8080).
server_url: https://trace-server:8080
poll_interval: 5s
heartbeat_interval: 30s
batch_interval: 2s
max_batch_size: 100
monitor_process: true
monitor_file: true
monitor_network: true
data_dir: /var/lib/trace-agent
