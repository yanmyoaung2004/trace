name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Tidy
        run: go mod tidy && git diff --exit-code

      - name: Install GCC (for race detector + DuckDB CGO)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libc6-dev

      - name: Vet
        run: go vet ./... 2>&1 | grep -v "etw_windows.go" || true

      - name: Lint
        run: go vet ./... 2>&1 | grep -v "etw_windows.go" || true

      - name: Build (no CGO)
        run: CGO_ENABLED=0 go build -o .trace ./cmd/trace

      - name: TSE default tests
        run: go test ./internal/storage/... -short -count=1

      - name: All short tests
        run: go test ./... -short -count=1 -p 2

      - name: TSE race detection
        run: go test -race ./internal/storage/... -short -count=1 -timeout 300s

      - name: TSE DuckDB (CGO)
        run: go test -tags cgo ./internal/storage/cold -count=1 -timeout 120s

      - name: TSE load tests
        run: go test ./internal/storage/... -run "TestPipeline_10kEventsThroughput|TestPipeline_100kEventsLoad|TestPipeline_500kEventsHighThroughput" -count=1 -timeout 300s

      - name: TSE crash recovery
        run: go test ./internal/storage/harness -run "TestCrashRecovery_NormalRun" -count=1 -timeout 120s

      - name: TSE fuzz (MergeSortDedupByID)
        run: go test ./internal/storage -fuzz=FuzzMergeSortDedupByID -fuzztime=10s

      - name: TSE fuzz (clampQuery)
        run: go test ./internal/storage/cold -fuzz=FuzzClampQuery -fuzztime=10s

      - name: TSE fuzz (buildHotQuery)
        run: go test ./internal/storage/sqlite -fuzz=FuzzBuildHotQuery -fuzztime=10s

      - name: SIEM fuzz (short)
        run: go test ./internal/siem/... -fuzz=FuzzAutoDecoder -fuzztime=10s

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
