name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-priv: single top-level read; jobs add only what they use.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          check-latest: false
          cache-dependency-path: ./go.sum

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Tidy
        run: go mod tidy && git diff --exit-code

      - name: Install GCC (for race detector + DuckDB CGO)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libc6-dev

      # Hard gate: vet failures fail CI (the old `|| true` swallowed them).
      # etw_windows.go is excluded: it is Windows-only code that the Linux
      # vet pass cannot typecheck; Windows coverage runs on windows-latest below.
      - name: Vet (linux)
        run: go vet $(go list ./... | grep -v internal/edr_agent/monitor)

      - name: Build (no CGO)
        run: CGO_ENABLED=0 go build -o .trace ./cmd/trace

      - name: TSE default tests
        run: go test ./internal/storage/... -short -count=1

      - name: Converter reproducible check
        run: |
          if [ -f tools/wazuh-converter/ruleset.lock ] && python3 -c "import json;e=json.load(open('tools/wazuh-converter/ruleset.lock'));exit(0 if e and not (len(e)==1 and e[0].get('path')=='rules/.placeholder') else 1)" 2>/dev/null; then
            go run ./tools/wazuh-converter -verify
          else
            echo "ruleset.lock not pinned yet (placeholder); skipping -verify. Pin the reviewed ruleset, then CI enforces reproducibility."
            go vet ./tools/wazuh-converter/
          fi

      - name: TSE race detection
        run: go test -race ./internal/storage/... -short -count=1 -timeout 300s

      - name: TSE DuckDB (CGO)
        run: go test -tags cgo ./internal/storage/cold -count=1 -timeout 120s

      - name: TSE load tests
        run: go test ./internal/storage/... -run "TestPipeline_10kEventsThroughput|TestPipeline_100kEventsLoad|TestPipeline_500kEventsHighThroughput" -count=1 -timeout 300s

      - name: TSE crash recovery
        run: go test ./internal/storage/harness -run "TestCrashRecovery_NormalRun" -count=1 -timeout 120s

      - name: Restore fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: testdata/fuzz
          key: fuzz-corpus-${{ hashFiles('internal/storage/**/*.go', 'internal/siem/**/*.go') }}
          restore-keys: |
            fuzz-corpus-

      - name: TSE fuzz (MergeSortDedupByID, corpus-backed)
        run: go test ./internal/storage -fuzz=FuzzMergeSortDedupByID -fuzztime=60s

      - name: TSE fuzz (clampQuery, corpus-backed)
        run: go test ./internal/storage/cold -fuzz=FuzzClampQuery -fuzztime=60s

      - name: TSE fuzz (buildHotQuery, corpus-backed)
        run: go test ./internal/storage/sqlite -fuzz=FuzzBuildHotQuery -fuzztime=60s

      - name: SIEM fuzz (corpus-backed)
        run: go test ./internal/siem -fuzz=FuzzAutoDecoder -fuzztime=60s

      - name: Updater fuzz (semver/version gate)
        run: go test ./internal/edr_agent/updater -fuzz=FuzzIsNewer -fuzztime=30s

      - name: Save fuzz corpus
        if: always()
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: testdata/fuzz
          key: fuzz-corpus-${{ hashFiles('internal/storage/**/*.go', 'internal/siem/**/*.go') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  vet-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          check-latest: false
          cache-dependency-path: ./go.sum
      # Covers the Windows-only monitor files excluded from the linux vet gate.
      - name: Vet (windows)
        run: go vet ./internal/edr_agent/monitor/...
