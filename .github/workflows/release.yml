name: Release

on:
  push:
    tags:
      - 'v*'

# Least-priv: release job creates the GitHub release + attestations only.
permissions:
  contents: write
  attestations: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: false
          cache: true
          cache-dependency-path: ./go.sum

      - name: Run tests
        run: go test ./... -short -count=1 -p 2

      # `make cross` previously dropped LDFLAGS (Version skew); build here
      # with the version baked in, matching the Dockerfile builder.
      - name: Build all platforms
        run: |
          VERSION="${GITHUB_REF_NAME:-0.1.0-dev}"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X github.com/yanmyoaung2004/trace/internal/edr_agent.Version=${VERSION}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o trace-linux-amd64 ./cmd/trace
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o trace-linux-arm64 ./cmd/trace
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o trace-darwin-amd64 ./cmd/trace
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o trace-darwin-arm64 ./cmd/trace
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o trace-windows-amd64.exe ./cmd/trace
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o trace-agent-linux-amd64 ./cmd/trace-agent
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o trace-agent-linux-arm64 ./cmd/trace-agent
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o trace-agent-windows-amd64.exe ./cmd/trace-agent
          echo "$VERSION" > VERSION.txt

      - name: Generate checksums + per-artifact sidecars
        run: |
          rm -f checksums.txt
          for f in trace-linux-amd64 trace-linux-arm64 trace-darwin-amd64 trace-darwin-arm64 trace-windows-amd64.exe trace-agent-linux-amd64 trace-agent-linux-arm64 trace-agent-windows-amd64.exe; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          sha256sum trace-* *.sha256 > checksums.txt || true
          cat checksums.txt
          # Playbook manifest (air-gap): single hash root for updatePlaybooks.
          mkdir -p playbooks
          cp playbooks/*.yaml playbooks/ 2>/dev/null || true
          python3 - playbooks > playbooks/manifest.json <<'PYEOF'
          import hashlib, json, sys, glob, os
          files = {}
          for p in sorted(glob.glob(os.path.join(sys.argv[1], '*.yaml'))):
              h = hashlib.sha256(open(p, 'rb').read()).hexdigest()
              files[os.path.basename(p)] = h
          json.dump({"files": files}, open(os.path.join(sys.argv[1], 'manifest.json'), 'w'), indent=2, sort_keys=True)
          print(f"manifest: {len(files)} playbooks")
          PYEOF

      - name: Sign binaries
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
          for f in trace-*; do
            case "$f" in *.asc|*.sig|*.sha256|*.sbom|checksums.txt) continue;; esac
            gpg --batch --pinentry-mode=loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --armor "$f"
          done

      - name: Attest build provenance + SBOM
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            trace-linux-amd64
            trace-linux-arm64
            trace-darwin-amd64
            trace-darwin-arm64
            trace-windows-amd64.exe
            trace-agent-linux-amd64
            trace-agent-linux-arm64
            trace-agent-windows-amd64.exe
            checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
           trace-linux-amd64
           trace-linux-arm64
           trace-darwin-amd64
           trace-darwin-arm64
           trace-windows-amd64.exe
           trace-agent-linux-amd64
           trace-agent-linux-arm64
           trace-agent-windows-amd64.exe
           trace-linux-amd64.sha256
           trace-linux-arm64.sha256
           trace-darwin-amd64.sha256
           trace-darwin-arm64.sha256
           trace-windows-amd64.exe.sha256
           trace-agent-linux-amd64.sha256
           trace-agent-linux-arm64.sha256
           trace-agent-windows-amd64.exe.sha256
           checksums.txt
           VERSION.txt
           trace-linux-amd64.asc
           trace-linux-arm64.asc
           trace-darwin-amd64.asc
           trace-darwin-arm64.asc
           trace-windows-amd64.exe.asc
           playbooks/manifest.json
          generate_release_notes: true
