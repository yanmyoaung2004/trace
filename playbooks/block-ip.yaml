name: block-ip
description: Block an IP address via firewall
triggers:
  - block
  - firewall
  - ban
steps:
  - agent: response
    action: block_ip
    wait: analyst_approval
    label: block-ip
    params:
      ip: ${input.ip}
  - agent: dispatch
    action: synthesize_report
    params:
      investigation_id: ${investigation.id}
